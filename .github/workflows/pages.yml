# 使用 GitHub Actions 构建并发布站点。
# 仓库 Settings → Pages → Build and deployment → Source 请选择「GitHub Actions」。
# https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # llms.txt / README 表格中的站点链接（与 CNAME 一致）
      SITE_BASE_URL: https://agent-doc.skyup.top
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync README article table
        run: python3 scripts/update_readme_articles.py

      - name: Commit README if article list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README article table already up to date."
          else
            git commit -m "docs: sync README article list"
            git push
          fi

      - name: Generate llms.txt
        run: python3 scripts/generate_llms_txt.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Jekyll 生成 .html 后，再把仓库里的源文件合并进 _site（供浏览器直接访问 .md 等），排除工程目录
      - name: Merge repo sources into site (exclude tooling)
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='_site/' \
            --exclude='Gemfile' \
            --exclude='Gemfile.lock' \
            --exclude='.jekyll-cache/' \
            --exclude='vendor/' \
            --exclude='_config.yml' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
