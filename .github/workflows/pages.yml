# 使用 GitHub Actions 构建并发布站点（含生成 llms.txt）。
# 仓库 Settings → Pages → Build and deployment → Source 请选择「GitHub Actions」。
name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write # README 文章表自动提交需要写权限
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync README article table
        run: python3 scripts/update_readme_articles.py

      - name: Commit README if article list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README article table already up to date."
          else
            git commit -m "docs: sync README article list"
            git push
          fi

      - name: Generate llms.txt
        run: python3 scripts/generate_llms_txt.py

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            . _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
